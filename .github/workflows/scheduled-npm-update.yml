name: Scheduled npm update

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: 'npm'

      # Materialize the lockfile tree before updating. Running `npm update` against a bare
      # checkout makes arborist build an ideal tree from nothing, which crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on the npm bundled with
      # Node 22.x. Kept in step with the sibling repo, where that crash was observed.
      - name: Install from lockfile
        run: npm ci
        env:
          HUSKY: 0

      - name: Update dependencies within ranges
        run: npm update
        env:
          HUSKY: 0

      - name: Verify lint, test, build, audit
        run: npm run release:check
        env:
          HUSKY: 0

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so ci.yml
          # would never run and the required lint-and-test (22.x) check could never pass.
          token: ${{ secrets.RELEASE_PAT }}
          base: develop
          branch: chore/npm-update-${{ github.run_id }}
          title: 'chore(deps): biweekly npm update'
          commit-message: 'chore(deps): npm update'
          body: |
            Automated `npm update` from the biweekly maintenance workflow.

            - Bumps within existing semver ranges only.
            - Verified locally in CI: `npm run release:check` (lint + test + build + audit).
          labels: |
            dependencies
            automated
          delete-branch: true

      # develop is protected with the required lint-and-test (22.x) check, so --auto queues the
      # merge behind CI rather than merging on the spot. release:check already passed above; this
      # is the second gate. Without this the PR sits open and the 3rd/17th release ships without it.
      # The guard skips no-op runs: when npm update changes nothing, no PR is opened and the
      # step outputs are empty.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
