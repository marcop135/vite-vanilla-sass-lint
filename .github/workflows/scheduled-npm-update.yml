name: Scheduled npm update

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Update dependencies within ranges
        run: npm update
        env:
          HUSKY: 0

      - name: Verify lint, test, build, audit
        run: npm run release:check
        env:
          HUSKY: 0

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so ci.yml
          # would never run and the required lint-and-test (22.x) check could never pass.
          token: ${{ secrets.RELEASE_PAT }}
          base: develop
          branch: chore/npm-update-${{ github.run_id }}
          title: 'chore(deps): biweekly npm update'
          commit-message: 'chore(deps): npm update'
          body: |
            Automated `npm update` from the biweekly maintenance workflow.

            - Bumps within existing semver ranges only.
            - Verified locally in CI: `npm run release:check` (lint + test + build + audit).
          labels: |
            dependencies
            automated
          delete-branch: true
